version: "3.9"

services:
  backend:
    build: ./bk
    container_name: backend

    ports:
      - "5000:5000"

    env_file:
      - ./bk/.env

    volumes:
      - ./bk:/app
      - /app/node_modules

    restart: unless-stopped

  frontend:
    build: ./fd
    container_name: frontend

    ports:
      - "5173:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true

    volumes:
      - ./fd:/app
      - /app/node_modules

    depends_on:
      - backend

    restart: unless-stopped